<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Weather App</title>
	</head>
	<body>
		<dialog id="confirmDialog">
			<div class="container">
				<h2>
					<i class="fi fi-rs-triangle-warning"></i> Location needed
				</h2>
				<p>
					Confirm access to your location to automatically get the
					weather in your city (Preference saves to browser)
				</p>
				<div class="buttons-container">
					<button
						id="confirmButton"
						commandfor="confirmDialog"
						command="close"
					>
						Confirm
					</button>
					<button
						id="denyButton"
						commandfor="confirmDialog"
						command="close"
					>
						Deny
					</button>
				</div>
			</div>
		</dialog>
		<div class="content">
			<div class="row search">
				<form id="locationForm" class="row">
					<div>
						<label for="searchLocation">Location</label>
						<input
							type="search"
							name="location"
							id="searchLocation"
							placeholder="Location"
							required
						/>
					</div>
					<button type="submit" id="submitLocation">Search</button>
					<button type="button" id="getMyWeather">
						Get My Weather
					</button>
				</form>
			</div>
			<div class="row head">
				<div class="conditions">
					<div class="temperature-container">
						<h1 id="temperature">20.0°</h1>
					</div>
				</div>
				<div class="highs-lows">
					<h2 id="high">99</h2>
					<h2 id="low">0</h2>
				</div>
				<div class="unit-switcher">
					<button
						type="button"
						id="unitSwitch"
						data-unit-group="metric"
					>
						°C
					</button>
				</div>
			</div>
			<div class="row main">
				<div class="sub-row">
					<h2 id="locationText">Auckland, New Zealand</h2>
					<h2 id="conditionText">Clear Sky</h2>
				</div>
				<div class="sub-row">
					<div class="time-date">
						<h2 id="currentTime">12:00pm</h2>
						<p id="currentDate">Friday, 26th Sep</p>
					</div>
					<div class="stats">
						<p id="precipitation">Precipitation: 0%</p>
						<p id="wind">Humidity: 80%</p>
						<p id="humidity">Wind: 6km/h</p>
					</div>
				</div>
			</div>
			<div class="row 4-day-forecast">
				<div class="forecast-item">
					<h3 class="day">MON</h3>
					<i class="condition"></i>
				</div>
				<div class="forecast-item">
					<h3 class="day">TUE</h3>
					<i class="condition"></i>
				</div>
				<div class="forecast-item">
					<h3 class="day">WED</h3>
					<i class="condition"></i>
				</div>
				<div class="forecast-item">
					<h3 class="day">THU</h3>
					<i class="condition"></i>
				</div>
			</div>
		</div>
	</body>
</html>
