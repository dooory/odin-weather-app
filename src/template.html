<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Weather App</title>
	</head>
	<body>
		<dialog id="confirmDialog">
			<div class="container">
				<h2>Location needed</h2>
				<p>
					Confirm access to your location to automatically get the
					weather in your city
				</p>
				<div class="buttons-container">
					<button
						id="confirmButton"
						commandfor="confirmDialog"
						command="close"
					>
						Confirm
					</button>
					<button
						id="closeButton"
						commandfor="confirmDialog"
						command="close"
					>
						Deny
					</button>
				</div>
			</div>
		</dialog>
		<h1>Weather App</h1>
		<form id="locationForm">
			<div>
				<label for="searchLocation">Location</label>
				<input
					type="search"
					name="location"
					id="searchLocation"
					placeholder="Location"
					required
				/>
			</div>
			<div>
				<label for="unitGroup">Unit</label>
				<select name="unit-group" id="unitGroup" required>
					<option value="metric">Metric</option>
					<option value="us">US</option>
					<option value="uk">UK</option>
					<option value="base">Scientific</option>
				</select>
			</div>
			<button type="submit" id="submitLocation">Search</button>
			<button type="button" id="getMyWeather">Get My Weather</button>
		</form>
	</body>
</html>
